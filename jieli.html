<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anko JieLi probe</title><style>:root{font-family:system-ui;color-scheme:dark;background:#0b0d10;color:#f4f7fb}body{margin:0;padding:18px;max-width:760px;margin:auto}.card{background:#151922;border:1px solid #283040;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#4e7cff;color:white;margin:4px}button:disabled{opacity:.45}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:12px;padding:12px;min-height:240px;max-height:520px;overflow:auto}.ok{color:#78e7a2}.warn{color:#ffd37a}.bad{color:#ff8c8c}</style></head><body><h1>Anko JieLi RCSP probe</h1><p class="warn">v1 — read-only feature query over AE00/AE01/AE02. No firmware upload, erase, reboot or DFU entry.</p><div class="card"><button id="connect">Connect watch</button><button id="probe" disabled>Query JieLi features</button><button id="retry" disabled>Retry with RCSP session init</button><button id="copy" disabled>Copy report</button><div id="status">Not connected</div></div><div class="card"><pre id="log"></pre></div><script>(()=>{'use strict';const SVC=0xAE00,TX=0xAE01,RX=0xAE02;let dev,server,tx,rx,lines=[];const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));function log(s){lines.push(s);$('log').textContent=lines.join('\n');$('log').scrollTop=$('log').scrollHeight}function hex(a){return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ')}function frame(flags,op,sn,payload=[]){const p=Uint8Array.from(payload),len=1+p.length,o=new Uint8Array(8+len);o.set([0xFE,0xDC,0xBA,flags,op,(len>>8)&255,len&255,sn],0);o.set(p,8);o[o.length-1]=0xEF;return o}function parseAttrs(a){let i=0;const names={0:'protocol_version',1:'sys_info',2:'edr_addr',3:'platform',4:'function_info',5:'device_version',6:'sdk_type',7:'uboot_version',8:'double_partition',9:'update_status',10:'vid_pid',11:'authkey',12:'procode',13:'max_mtu',19:'md5_game_support'};while(i+2<=a.length){const n=a[i];if(n===0||i+1+n>a.length){log('  attribute parse stops at '+i+'; remaining='+hex(a.slice(i)));break}const type=a[i+1],data=a.slice(i+2,i+1+n);log(`  ATTR ${type}${names[type]?' '+names[type]:''}: ${hex(data)}`);if(type===6&&data.length)log('    SDK type byte = 0x'+data[0].toString(16).padStart(2,'0')+' (public JL701N watch SDK uses 0x09)');if(type===8&&data.length>=3)log(`    OTA: double-bank=${!!data[0]}, loader-download=${!!data[1]}, channel=${data[2]}`);if(type===10&&data.length>=4)log(`    VID=0x${((data[0]<<8)|data[1]).toString(16).padStart(4,'0')} PID=0x${((data[2]<<8)|data[3]).toString(16).padStart(4,'0')}`);if(type===13&&data.length>=4)log(`    RCSP MTU tx=${(data[0]<<8)|data[1]} rx=${(data[2]<<8)|data[3]}`);if(type===19&&data.length){const f=data[0];log(`    GAME/feature flags 0x${f.toString(16).padStart(2,'0')}: game_mode=${!!(f&2)}, find_device=${!!(f&4)}, karaoke=${!!(f&8)}, sound_effects_disabled=${!!(f&16)}, extra_flash=${!!(f&32)}`)}i+=1+n}}function onNotify(ev){const d=new Uint8Array(ev.target.value.buffer,ev.target.value.byteOffset,ev.target.value.byteLength);log('RX: '+hex(d));if(d.length>=9&&d[0]===0xFE&&d[1]===0xDC&&d[2]===0xBA){const op=d[4],plen=(d[5]<<8)|d[6],body=d.slice(7,7+plen);log(`RCSP frame op=0x${op.toString(16).padStart(2,'0')} plen=${plen}`);if(op===3&&body.length>=2){const status=body[0],sn=body[1],attrs=body.slice(2);log(`GET_TARGET_FEATURE response status=${status} sn=${sn}`);parseAttrs(attrs);$('copy').disabled=false;$('status').textContent='Got JieLi feature response';$('status').className='ok'}}else if(d.length&&d[0]<=2)log('Possible JieLi auth-handshake packet seen.')}async function connect(){try{dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC]});server=await dev.gatt.connect();const s=await server.getPrimaryService(SVC);tx=await s.getCharacteristic(TX);rx=await s.getCharacteristic(RX);await rx.startNotifications();rx.addEventListener('characteristicvaluechanged',onNotify);$('probe').disabled=false;$('retry').disabled=false;$('status').textContent='Connected: '+(dev.name||'watch');$('status').className='ok';log('Connected to AE00 / AE01 / AE02.')}catch(e){$('status').textContent='Connect error: '+e.message;$('status').className='bad'}}async function query(sn){const f=frame(0xC0,0x03,sn,[0xFF,0xFF,0xFF,0xFF,0x00]);log('TX GET_TARGET_FEATURE: '+hex(f));await tx.writeValueWithoutResponse(f)}$('connect').onclick=connect;$('probe').onclick=async()=>{log('--- direct read-only target-feature query ---');await query(0x40);await sleep(1800);if($('status').textContent.startsWith('Connected'))log('No target-feature reply yet. If so, use Retry with RCSP session init.');};$('retry').onclick=async()=>{log('--- RCSP session init, then same read-only feature query ---');const init=frame(0xC0,0x06,0x41,[0x01]);log('TX session init: '+hex(init));await tx.writeValueWithoutResponse(init);await sleep(400);await query(0x42);};$('copy').onclick=async()=>{await navigator.clipboard.writeText(lines.join('\n'));$('status').textContent='Report copied';};})();</script></body></html>
