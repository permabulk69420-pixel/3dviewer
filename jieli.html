<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anko JieLi auth test</title>
<style>:root{font-family:system-ui;color-scheme:dark;background:#0b0d10;color:#f4f7fb}body{margin:0;padding:18px;max-width:760px;margin:auto}.card{background:#151922;border:1px solid #283040;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#4e7cff;color:white;margin:4px}button:disabled{opacity:.45}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:12px;padding:12px;min-height:280px;max-height:560px;overflow:auto}.warn{color:#ffd37a}.ok{color:#78e7a2}.bad{color:#ff8c8c}</style></head><body>
<h1>Anko JieLi RCSP auth test</h1>
<p class="warn">v3.1 — exact reset-auth packet from JieLi RcspAuth, then the standard 17-byte authentication challenge. This does not enter OTA mode or write firmware.</p>
<div class="card"><button id="connect">Connect watch</button><button id="probe" disabled>Run exact auth sequence</button><button id="copy" disabled>Copy report</button><div id="status">Not connected</div></div>
<div class="card"><pre id="log"></pre></div>
<script>
(()=>{'use strict';
const SVC=0xAE00,TX=0xAE01,RX=0xAE02;
// Exact RcspAuth.getResetAuthFlagCmdData(): FEDCBAC00600020001EF
const RESET=Uint8Array.from([0xfe,0xdc,0xba,0xc0,0x06,0x00,0x02,0x00,0x01,0xef]);
let dev,server,tx,rx,authApi=null,state='idle',resolveAuth,rejectAuth,lines=[];
const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(s){lines.push(s);$('log').textContent=lines.join('\n');$('log').scrollTop=$('log').scrollHeight}
function hex(a){return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ')}
async function write(a,label){log(label+': '+hex(a));await tx.writeValueWithoutResponse(a)}
async function loadAuth(){if(authApi)return authApi;log('Loading reverse-engineered libjl_auth implementation…');const u='https://cdn.jsdelivr.net/gh/hybridherbst/web-bluetooth-e87@9e8ba39f48ffb7ef447847b5bf35afc4fe522ed3/web/src/jl-auth.ts';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('auth module HTTP '+r.status);let s=await r.text();s=s.replace(/\bexport\s+/g,'').replace(/:\s*Record<number,\s*number>/g,'').replace(/:\s*number\[\]/g,'').replace(/:\s*Uint8Array/g,'').replace(/:\s*number/g,'').replace(/new Array<number>/g,'new Array');authApi=(new Function(s+'\nreturn {getRandomAuthData,getEncryptedAuthData};'))();log('Auth implementation loaded.');return authApi}
function onNotify(ev){const v=ev.target.value,d=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);log('RX: '+hex(d));
 if(state==='wait1'&&d.length===17&&d[0]===1){state='waitChallenge';log('Device accepted phone challenge.');write(Uint8Array.from([0x02,0x70,0x61,0x73,0x73]),'TX PASS').catch(rejectAuth);return}
 if(state==='waitChallenge'&&d.length===17&&d[0]===0){state='waitPass';log('Device challenge received.');write(authApi.getEncryptedAuthData(d),'TX encrypted device challenge').catch(rejectAuth);return}
 if(state==='waitPass'&&d.length>=5&&d[0]===2&&d[1]===0x70&&d[2]===0x61&&d[3]===0x73&&d[4]===0x73){state='done';log('AUTH SUCCESS');resolveAuth();return}}
async function connect(){try{dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC]});server=await dev.gatt.connect();const s=await server.getPrimaryService(SVC);tx=await s.getCharacteristic(TX);rx=await s.getCharacteristic(RX);await rx.startNotifications();rx.addEventListener('characteristicvaluechanged',onNotify);$('probe').disabled=false;$('status').textContent='Connected: '+(dev.name||'watch');$('status').className='ok';log('Connected to AE00 / AE01 / AE02; AE02 notifications enabled.')}catch(e){$('status').textContent='Connect error';$('status').className='bad';log('CONNECT ERROR: '+e.message)}}
async function probe(){try{$('probe').disabled=true;await loadAuth();log('--- v3.1 exact JieLi reset-auth sequence ---');state='idle';await write(RESET,'TX official RESET_AUTH_FLAG');await sleep(500);state='wait1';const p=new Promise((res,rej)=>{resolveAuth=res;rejectAuth=rej;setTimeout(()=>{if(state!=='done')rej(Error('No completed JieLi auth response in 8 seconds'));},8000)});const challenge=authApi.getRandomAuthData();await write(challenge,'TX official-format random auth challenge');await p;$('status').textContent='AUTH SUCCESS';$('status').className='ok'}catch(e){$('status').textContent='Auth did not complete';$('status').className='bad';log('RESULT: '+(e.message||e))}finally{$('probe').disabled=false;$('copy').disabled=false}}
$('connect').onclick=connect;$('probe').onclick=probe;$('copy').onclick=async()=>{await navigator.clipboard.writeText(lines.join('\n'));$('status').textContent='Report copied'};log('v3.1 loaded.');
})();
</script></body></html>
