<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anko Watch JieLi Discovery</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;background:#0b0d10;color:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:760px;margin-inline:auto}h1{font-size:1.45rem;margin:.2rem 0}.sub{color:#aeb7c4;margin:.25rem 0 1rem}.card{background:#151922;border:1px solid #283040;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#4e7cff;color:white;margin:4px}button.secondary{background:#283246}button:disabled{opacity:.45}.ok{color:#78e7a2}.warn{color:#ffd37a}.bad{color:#ff8c8c}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:12px;padding:12px;min-height:300px;max-height:560px;overflow:auto;font-size:.78rem}
</style></head><body>
<h1>Anko JieLi discovery</h1>
<div class="sub">v4 — exact JieLi reset/auth handshake, then read-only target/OTA metadata queries. No firmware write, erase, reboot or OTA-mode command.</div>
<div class="card">
  <button id="connect">1. Connect watch</button>
  <button id="probe" disabled>2. Authenticate + identify watch</button>
  <button id="copy" class="secondary" disabled>Copy report</button>
  <div id="status" class="warn" style="margin-top:12px">Not connected</div>
</div>
<div class="card"><strong>Discovery log</strong><pre id="log"></pre></div>
<script>
(()=>{'use strict';
const SVC=0xAE00,TX=0xAE01,RX=0xAE02;
const RESET=Uint8Array.from([0xfe,0xdc,0xba,0xc0,0x06,0x00,0x02,0x00,0x01,0xef]);
const PASS=Uint8Array.from([0x02,0x70,0x61,0x73,0x73]);
let dev=null,server=null,tx=null,rx=null,authApi=null,state='idle',resolveAuth=null,rejectAuth=null,lines=[],targetSeen=false;
const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(s){const line=`[${new Date().toLocaleTimeString()}] ${s}`;lines.push(line);$('log').textContent=lines.join('\n');$('log').scrollTop=$('log').scrollHeight}
function hex(a){return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ')}
function frame(flag,cmd,body=[]){const b=Uint8Array.from(body),o=new Uint8Array(8+b.length);o.set([0xfe,0xdc,0xba,flag,cmd,(b.length>>8)&255,b.length&255]);o.set(b,7);o[o.length-1]=0xef;return o}
async function write(a,label){log(label+': '+hex(a));await tx.writeValueWithoutResponse(a)}
async function loadAuth(){
  if(authApi)return authApi;
  log('Loading JieLi auth implementation…');
  const u='https://cdn.jsdelivr.net/gh/hybridherbst/web-bluetooth-e87@9e8ba39f48ffb7ef447847b5bf35afc4fe522ed3/web/src/jl-auth.ts';
  const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('auth module HTTP '+r.status);
  let s=await r.text();
  s=s.replace(/\bexport\s+/g,'').replace(/:\s*Record<number,\s*number>/g,'').replace(/:\s*number\[\]/g,'').replace(/:\s*Uint8Array/g,'').replace(/:\s*number/g,'').replace(/new Array<number>/g,'new Array');
  authApi=(new Function(s+'\nreturn {getRandomAuthData,getEncryptedAuthData};'))();
  log('JieLi auth implementation loaded.');return authApi;
}
function parseAttrs(a){
  const names={0:'protocol_version',1:'sys_info',2:'edr_addr',3:'platform',4:'function_info',5:'firmware_info',6:'sdk_type',7:'uboot_version',8:'double_partition',9:'update_status',10:'vid_pid',11:'authkey',12:'project_code',13:'protocol_mtu',19:'dev_support_func'};
  let i=0;
  while(i+2<=a.length){
    const n=a[i];if(n<1||i+1+n>a.length){log('ATTR parse stopped; remaining: '+hex(a.slice(i)));break}
    const type=a[i+1],data=a.slice(i+2,i+1+n),name=names[type]||'unknown';
    log(`ATTR ${type} ${name}: ${hex(data)}`);
    if(type===5&&data.length)log('  firmware_info ASCII: '+Array.from(data,b=>b>=32&&b<127?String.fromCharCode(b):'.').join(''));
    if(type===6&&data.length)log('  SDK type = 0x'+data[0].toString(16).padStart(2,'0')+(data[0]===9?' (AC701N/JL701N watch family)':''));
    if(type===8&&data.length>=3)log(`  OTA double-bank=${!!data[0]}, loader-download=${!!data[1]}, channel=${data[2]}`);
    if(type===10&&data.length>=4)log('  VID=0x'+((data[0]<<8)|data[1]).toString(16).padStart(4,'0')+' PID=0x'+((data[2]<<8)|data[3]).toString(16).padStart(4,'0'));
    if(type===12&&data.length)log('  project_code ASCII: '+Array.from(data,b=>b>=32&&b<127?String.fromCharCode(b):'.').join(''));
    if(type===13&&data.length>=2)log('  RCSP MTU = '+((data[0]<<8)|data[1]));
    if(type===19&&data.length){const f=data[0];log(`  feature flags 0x${f.toString(16).padStart(2,'0')}: game_mode=${!!(f&2)}, find_device=${!!(f&4)}, karaoke=${!!(f&8)}, extra_flash=${!!(f&32)}`)}
    i+=1+n;
  }
}
function parseRcsp(d){if(d.length<8||d[0]!==0xfe||d[1]!==0xdc||d[2]!==0xba||d[d.length-1]!==0xef)return null;const len=(d[5]<<8)|d[6];if(d.length!==8+len)return null;return{flag:d[3],cmd:d[4],body:d.slice(7,7+len)}}
function onNotify(ev){
  const v=ev.target.value,d=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);log('RX: '+hex(d));
  const f=parseRcsp(d);
  if(f){
    log(`RCSP cmd=0x${f.cmd.toString(16).padStart(2,'0')} flag=0x${f.flag.toString(16).padStart(2,'0')} body=${hex(f.body)}`);
    if(f.cmd===0x02){log('GET_TARGET_FEATURE_MAP reply: '+hex(f.body));}
    if(f.cmd===0x03&&f.body.length>=2){targetSeen=true;log(`GET_TARGET_INFO reply status=${f.body[0]} seq=${f.body[1]}`);parseAttrs(f.body.slice(2));}
    return;
  }
  if(state==='waitAccept'&&d.length===17&&d[0]===1){state='waitChallenge';log('Device accepted phone challenge.');write(PASS,'TX PASS').catch(e=>rejectAuth&&rejectAuth(e));return}
  if(state==='waitChallenge'&&d.length===17&&d[0]===0){try{state='waitPass';log('Device challenge received.');write(authApi.getEncryptedAuthData(d),'TX encrypted device challenge').catch(e=>rejectAuth&&rejectAuth(e))}catch(e){rejectAuth&&rejectAuth(e)}return}
  if(state==='waitPass'&&d.length>=5&&d[0]===2&&d[1]===0x70&&d[2]===0x61&&d[3]===0x73&&d[4]===0x73){state='done';log('AUTH SUCCESS');resolveAuth&&resolveAuth();return}
}
async function connect(){
  try{
    if(!('bluetooth' in navigator))throw Error('Web Bluetooth unavailable');
    log('Opening Bluetooth chooser…');
    dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC]});
    server=await dev.gatt.connect();const s=await server.getPrimaryService(SVC);tx=await s.getCharacteristic(TX);rx=await s.getCharacteristic(RX);
    await rx.startNotifications();rx.addEventListener('characteristicvaluechanged',onNotify);
    $('probe').disabled=false;$('status').textContent='Connected: '+(dev.name||'watch');$('status').className='ok';log('Connected to AE00 / AE01 / AE02; notifications enabled.');
  }catch(e){$('status').textContent='Connect failed';$('status').className='bad';log('CONNECT ERROR: '+(e.message||e))}
}
async function authenticate(){
  await loadAuth();state='idle';
  await write(RESET,'TX official RESET_AUTH_FLAG');await sleep(500);
  state='waitAccept';
  const p=new Promise((res,rej)=>{resolveAuth=res;rejectAuth=rej;setTimeout(()=>{if(state!=='done')rej(Error('JieLi authentication timed out after 10 seconds; last state='+state))},10000)});
  await write(authApi.getRandomAuthData(),'TX random auth challenge');await p;
}
async function queryTarget(){
  targetSeen=false;
  await write(frame(0xc0,0x02,[0x01]),'TX GET_TARGET_FEATURE_MAP');await sleep(900);
  await write(frame(0xc0,0x03,[0x02,0xff,0xff,0xff,0xff,0x00]),'TX GET_TARGET_INFO platform=0');await sleep(1800);
  if(!targetSeen){log('No target-info reply for platform=0; trying platform=1.');await write(frame(0xc0,0x03,[0x03,0xff,0xff,0xff,0xff,0x01]),'TX GET_TARGET_INFO platform=1');await sleep(2200)}
  if(!targetSeen)throw Error('Authenticated, but GET_TARGET_INFO produced no reply');
}
async function probe(){
  try{
    $('probe').disabled=true;$('copy').disabled=true;$('status').textContent='Authenticating…';$('status').className='warn';
    log('=== v4 JIELI DISCOVERY START ===');await authenticate();
    $('status').textContent='Authenticated; reading target info…';await queryTarget();
    $('status').textContent='Discovery complete — copy the report';$('status').className='ok';log('=== DISCOVERY COMPLETE ===');
  }catch(e){$('status').textContent='Stopped — copy the report';$('status').className='bad';log('RESULT: '+(e.message||e))}
  finally{$('probe').disabled=false;$('copy').disabled=false}
}
$('connect').onclick=connect;$('probe').onclick=probe;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));$('status').textContent='Report copied'}catch{log('Clipboard failed; long-press the log and copy manually.')}};
log('Ready — v4 JieLi discovery.');
})();
</script></body></html>
