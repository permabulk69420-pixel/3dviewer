name: Extract exact JieLi DFU path

on:
  push:
    paths:
      - '.github/workflows/re-dafit-jieli-dfu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract exact JieLi DFU classes
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          rm -rf /tmp/crp /tmp/classes
          mkdir -p /tmp/crp /tmp/classes "$GITHUB_WORKSPACE/re/dafit_crp/dfu"
          cd /tmp/crp && unzip -q /tmp/crp.aar
          cd /tmp/classes && jar xf /tmp/crp/classes.jar

          declare -A classes=(
            [controller]='com.crrepa.ble.ota.jieli.JieliDfuController'
            [i0-a]='com.crrepa.i0.a'
            [i0-b]='com.crrepa.i0.b'
            [c0-c]='com.crrepa.c0.c'
            [c0-d]='com.crrepa.c0.d'
            [c0-e]='com.crrepa.c0.e'
            [m-f]='com.crrepa.m.f'
            [q-b]='com.crrepa.q.b'
            [u1]='com.crrepa.f.u1'
          )
          for name in "${!classes[@]}"; do
            javap -classpath /tmp/crp/classes.jar -c -p -constants "${classes[$name]}" > "$GITHUB_WORKSPACE/re/dafit_crp/dfu/$name.txt" 2>&1 || true
          done

      - name: Commit split DFU dump
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/dfu
          git commit -m 'Add split JieLi DFU decompile' || exit 0
          git push
