name: Extract Da Fit firmware network surface

on:
  push:
    paths:
      - '.github/workflows/re-dafit-jieli-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract every MoYoung firmware endpoint and caller
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          rm -rf /tmp/crp /tmp/classes
          mkdir -p /tmp/crp /tmp/classes "$GITHUB_WORKSPACE/re/dafit_crp"
          cd /tmp/crp && unzip -q /tmp/crp.aar
          cd /tmp/classes && jar xf /tmp/crp/classes.jar

          OUT="$GITHUB_WORKSPACE/re/dafit_crp/firmware-network-surface.txt"
          : > "$OUT"

          echo '===== URL / DOMAIN STRINGS =====' >> "$OUT"
          (strings -a /tmp/crp/classes.jar | grep -Eio 'https?://[^[:space:]"<>]+' || true) | sort -u >> "$OUT"
          (grep -aRhoE 'https?://[^[:space:]"<>]+' /tmp/classes || true) | sort -u >> "$OUT"

          echo >> "$OUT"
          echo '===== MOYOUNG / UPGRADE / FIRMWARE STRING HITS =====' >> "$OUT"
          (strings -a /tmp/crp/classes.jar | grep -Ei 'moyoung|upgrade|firmware|factory|beta|download|\.ufw|uploads/jieli' || true) | sort -u >> "$OUT"

          echo >> "$OUT"
          echo '===== MATCHING CLASSES (FULL JAVAP) =====' >> "$OUT"
          mapfile -t MATCHES < <(grep -aRIl -E 'moyoung|upgrade|factory|beta|FirmwareVersionInfo|FirmwareUpgradePresenter|downloadNewFirmware' /tmp/classes/com/crrepa --include='*.class' 2>/dev/null | sort -u || true)
          for f in "${MATCHES[@]}"; do
            c="${f#/tmp/classes/}"; c="${c%.class}"; c="${c//\//.}"
            echo >> "$OUT"
            echo "===== $c =====" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" >> "$OUT" 2>&1 || true
          done

          echo >> "$OUT"
          echo '===== ALL com.crrepa.r NETWORK HELPERS =====' >> "$OUT"
          mapfile -t NETS < <(find /tmp/classes/com/crrepa/r -name '*.class' -type f 2>/dev/null | sort || true)
          for f in "${NETS[@]}"; do
            c="${f#/tmp/classes/}"; c="${c%.class}"; c="${c//\//.}"
            echo >> "$OUT"
            echo "===== $c =====" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" >> "$OUT" 2>&1 || true
          done

          wc -l "$OUT"
      - name: Commit firmware network surface
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/firmware-network-surface.txt
          git commit -m 'Add complete MoYoung firmware network surface' || exit 0
          git push
