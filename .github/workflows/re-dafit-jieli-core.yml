name: Trace Da Fit forced update and target builders

on:
  push:
    paths:
      - '.github/workflows/re-dafit-jieli-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract focused classes
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          rm -rf /tmp/crp /tmp/classes
          mkdir -p /tmp/crp /tmp/classes "$GITHUB_WORKSPACE/re/dafit_crp"
          cd /tmp/crp && unzip -q /tmp/crp.aar
          cd /tmp/classes && jar xf /tmp/crp/classes.jar

          OUT="$GITHUB_WORKSPACE/re/dafit_crp/forced-update-and-builders.txt"
          : > "$OUT"
          for c in \
            com.crrepa.ble.trans.upgrade.presenter.FirmwareUpgradePresenter \
            com.crrepa.ble.trans.upgrade.bean.FirmwareVersionInfo \
            com.crrepa.ble.conn.type.CRPFirmwareUpgradeType \
            com.crrepa.f.w \
            com.crrepa.f.u \
            com.crrepa.e.e \
            com.crrepa.e.c; do
            echo >> "$OUT"
            echo "===== $c =====" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" >> "$OUT" 2>&1 || true
          done
          wc -l "$OUT"
      - name: Commit focused dump
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/forced-update-and-builders.txt
          git commit -m 'Add forced-update and target-builder trace' || exit 0
          git push
