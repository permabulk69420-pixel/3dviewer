name: Extract Da Fit JieLi BLE core

on:
  push:
    paths:
      - '.github/workflows/re-dafit-jieli-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract proprietary firmware-version query
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          mkdir -p /tmp/crp && cd /tmp/crp && unzip -q /tmp/crp.aar
          mkdir -p /tmp/classes && cd /tmp/classes && jar xf /tmp/crp/classes.jar
          OUT="$GITHUB_WORKSPACE/re/dafit_crp/ota-version-query.txt"
          : > "$OUT"
          for cls in com.crrepa.f.o1 com.crrepa.e.e com.crrepa.h.a com.crrepa.m.a; do
            echo "===== $cls =====" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$cls" >> "$OUT" 2>&1 || true
          done
          echo '===== classes referencing CRPDeviceFirmwareVersionCallback =====' >> "$OUT"
          grep -RIl --binary-files=text 'CRPDeviceFirmwareVersionCallback' com --include='*.class' | sort | tee /tmp/refs.txt >> "$OUT" || true
          while read -r f; do
            [ -n "$f" ] || continue
            cls="${f%.class}"; cls="${cls//\//.}"
            echo "===== CALLBACK REF $cls =====" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$cls" >> "$OUT" 2>&1 || true
          done < /tmp/refs.txt
      - name: Commit focused dump
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/ota-version-query.txt
          git commit -m 'Add proprietary OTA version query analysis' || exit 0
          git push
