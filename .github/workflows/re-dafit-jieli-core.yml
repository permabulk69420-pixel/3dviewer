name: Extract Da Fit JieLi BLE core

on:
  push:
    paths:
      - '.github/workflows/re-dafit-jieli-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and inspect CRP core
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          mkdir -p /tmp/crp && cd /tmp/crp && unzip -q /tmp/crp.aar
          OUT="$GITHUB_WORKSPACE/re/dafit_crp/jieli-core.txt"
          : > "$OUT"
          for cls in \
            com.crrepa.i0.a \
            com.crrepa.i0.b \
            com.crrepa.c0.c \
            com.crrepa.c0.d \
            com.crrepa.c0.e \
            com.crrepa.m.f \
            com.crrepa.m.c \
            com.crrepa.q.b \
            com.crrepa.p.c \
            com.crrepa.p.a \
            com.crrepa.f.u1 \
            com.crrepa.l.a \
            com.crrepa.ble.ota.jieli.JieliDfuController \
            com.crrepa.ble.conn.bean.CRPFirmwareVersionInfo \
            com.crrepa.ble.conn.type.CRPFirmwareUpgradeType; do
            echo "===== $cls =====" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$cls" >> "$OUT" 2>&1 || true
          done
          mkdir -p /tmp/classes && cd /tmp/classes && jar xf /tmp/crp/classes.jar
          {
            echo '===== binary class refs: transFileIndex ====='
            grep -R -l -a 'transFileIndex' com 2>/dev/null || true
            echo '===== binary class refs: com/crrepa/i0/a ====='
            grep -R -l -a 'com/crrepa/i0/a' com 2>/dev/null || true
          } >> "$OUT"
      - name: Commit focused dump
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/jieli-core.txt
          git commit -m 'Add JieLi DFU response-parser analysis' || exit 0
          git push
