name: Extract Da Fit JieLi BLE core

on:
  push:
    paths:
      - '.github/workflows/re-dafit-jieli-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract exact firmware-version protocol
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          mkdir -p /tmp/crp && cd /tmp/crp && unzip -q /tmp/crp.aar
          mkdir -p /tmp/classes && cd /tmp/classes && jar xf /tmp/crp/classes.jar
          mkdir -p "$GITHUB_WORKSPACE/re/dafit_crp"
          javap -classpath /tmp/crp/classes.jar -c -p -constants com.crrepa.f.w > "$GITHUB_WORKSPACE/re/dafit_crp/firmware-version-builder.txt"
          : > "$GITHUB_WORKSPACE/re/dafit_crp/queryFirmwareVersion-implementation.txt"
          grep -aRl -E 'queryFrimwareVersion|queryFirmwareVersion' /tmp/classes/com/crrepa --include='*.class' | while read f; do
            c="${f#/tmp/classes/}"; c="${c%.class}"; c="${c//\//.}"
            echo "===== $c =====" >> "$GITHUB_WORKSPACE/re/dafit_crp/queryFirmwareVersion-implementation.txt"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" >> "$GITHUB_WORKSPACE/re/dafit_crp/queryFirmwareVersion-implementation.txt"
          done
      - name: Commit focused dump
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189827+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/firmware-version-builder.txt re/dafit_crp/queryFirmwareVersion-implementation.txt
          git commit -m 'Add exact queryFirmwareVersion implementation' || exit 0
          git push
