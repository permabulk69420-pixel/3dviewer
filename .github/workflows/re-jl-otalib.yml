name: Reverse engineer JieLi OTALib

on:
  push:
    paths:
      - '.github/workflows/re-jl-otalib.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official JieLi OTALib binary
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/Jieli-Tech/iOS-JL_OTA/9ce53d85213748e9aaca074d42048d458afe45ff/code/JL_OTA/Frameworks/JL_OTALib.xcframework/ios-arm64/JL_OTALib.framework/JL_OTALib'
          curl -fL "$URL" -o /tmp/JL_OTALib
          test -s /tmp/JL_OTALib
          file /tmp/JL_OTALib

      - name: Dump symbols strings ObjC metadata and ARM64 disassembly
        run: |
          set -euxo pipefail
          OUT='re/jl_otalib'
          mkdir -p "$OUT"
          file /tmp/JL_OTALib > "$OUT/file.txt"
          shasum -a 256 /tmp/JL_OTALib > "$OUT/sha256.txt"
          strings -a -t x /tmp/JL_OTALib > "$OUT/strings.txt" || true
          nm -nm /tmp/JL_OTALib > "$OUT/nm.txt" 2>&1 || true
          otool -l /tmp/JL_OTALib > "$OUT/load_commands.txt" 2>&1 || true
          otool -Iv /tmp/JL_OTALib > "$OUT/indirect_symbols.txt" 2>&1 || true
          otool -ov /tmp/JL_OTALib > "$OUT/objc.txt" 2>&1 || true
          otool -tvV /tmp/JL_OTALib > "$OUT/disassembly.txt" 2>&1 || true
          {
            echo '=== TARGET / OTA STRINGS ==='
            grep -Ein 'cmdTargetFeature|TargetFeature|target feature|cmdSystemFunction|noteEntityConnected|otaDataSend|target|feature|rcsp|opcode|packet|send' "$OUT/strings.txt" || true
            echo
            echo '=== TARGET / OTA SYMBOLS ==='
            grep -Ein 'cmdTargetFeature|TargetFeature|cmdSystemFunction|noteEntityConnected|otaDataSend|target|feature|rcsp|opcode|packet|send' "$OUT/nm.txt" || true
            echo
            echo '=== OBJC MANAGER METHODS ==='
            grep -Ein -A16 -B6 'cmdTargetFeature|cmdSystemFunction|noteEntityConnected|otaDataSend|JL_OTAManager' "$OUT/objc.txt" || true
          } > "$OUT/interesting.txt"

      - name: Commit analysis output
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/jl_otalib
          git commit -m 'Add JieLi OTALib binary analysis' || exit 0
          git push
