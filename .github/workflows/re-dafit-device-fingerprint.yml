name: Extract Da Fit device fingerprint protocol

on:
  push:
    paths:
      - '.github/workflows/re-dafit-device-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract read-only fingerprint builders/parsers
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          rm -rf /tmp/crp /tmp/classes
          mkdir -p /tmp/crp /tmp/classes "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint"
          cd /tmp/crp && unzip -q /tmp/crp.aar
          cd /tmp/classes && jar xf /tmp/crp/classes.jar

          OUT="$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/index.txt"
          : > "$OUT"
          PAT='CRPDeviceFunction|CRPAvailableStorage|CRPDeviceFirmwareVersion|CRPDeviceNewFirmwareVersion|CRPJieliWatchFace|CRPFlashNotification|CRPDeviceVersion|CRPDeviceModel|CRPDeviceInfo|platform|chipType|mcu|hardwareVersion'
          mapfile -t MATCHES < <(grep -aRIl -E "$PAT" /tmp/classes/com/crrepa --include='*.class' 2>/dev/null | sort -u || true)
          printf 'matched_classes=%d\n' "${#MATCHES[@]}" >> "$OUT"
          for f in "${MATCHES[@]}"; do
            c="${f#/tmp/classes/}"; c="${c%.class}"; c="${c//\//.}"
            safe="${c//./_}"
            echo "$c" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" > "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/$safe.txt" 2>&1 || true
          done

          # Always include known command-builder and parser hubs used by the connection implementation.
          for c in com.crrepa.f.a2 com.crrepa.f.w com.crrepa.i0.a com.crrepa.i0.b; do
            safe="${c//./_}"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" > "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/$safe.txt" 2>&1 || true
          done

      - name: Commit fingerprint dump
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/fingerprint
          git commit -m 'Add read-only device fingerprint decompile' || exit 0
          git push
