name: Extract Da Fit device fingerprint protocol

on:
  push:
    paths:
      - '.github/workflows/re-dafit-device-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract complete read-only query surface
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          rm -rf /tmp/crp /tmp/classes "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint"
          mkdir -p /tmp/crp /tmp/classes "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint"
          cd /tmp/crp && unzip -q /tmp/crp.aar
          cd /tmp/classes && jar xf /tmp/crp/classes.jar

          jar tf /tmp/crp/classes.jar | sort > "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/all-classes.txt"
          jar tf /tmp/crp/classes.jar | grep '^com/crrepa/ble/conn/callback/CRP.*\.class$' | sort > "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/callback-classes.txt" || true
          jar tf /tmp/crp/classes.jar | grep '^com/crrepa/ble/conn/.*\.class$' | sort > "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/connection-classes.txt" || true

          for c in \
            com.crrepa.ble.conn.CRPBleConnection \
            com.crrepa.ble.CRPBleClient \
            com.crrepa.f.a2 \
            com.crrepa.f.w \
            com.crrepa.i0.a \
            com.crrepa.i0.b; do
            safe="${c//./_}"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" > "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/$safe.txt" 2>&1 || true
          done

          # Dump every concrete class whose method signatures mention one of the most useful read-only callbacks.
          PAT='CRPDeviceFirmwareVersionCallback|CRPDeviceNewFirmwareVersionCallback|CRPAvailableStorageCallback|CRPJieliWatchFaceInfoCallback|CRPDeviceFunctionCallback|CRPBtAddressCallback|CRPDeviceVersion'
          : > "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/matched.txt"
          while IFS= read -r f; do
            case "$f" in *'$'*) continue;; esac
            c="${f#/tmp/classes/}"; c="${c%.class}"; c="${c//\//.}"
            sig=$(javap -classpath /tmp/crp/classes.jar -p "$c" 2>/dev/null || true)
            if printf '%s' "$sig" | grep -Eq "$PAT"; then
              echo "$c" >> "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/matched.txt"
              safe="${c//./_}"
              javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" > "$GITHUB_WORKSPACE/re/dafit_crp/fingerprint/$safe.txt" 2>&1 || true
            fi
          done < <(find /tmp/classes/com/crrepa -name '*.class' -type f | sort)

      - name: Commit query-surface dump
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/fingerprint
          git commit -m 'Add complete CRP connection query surface' || exit 0
          git push
