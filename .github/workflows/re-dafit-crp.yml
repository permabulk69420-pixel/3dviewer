name: Reverse engineer Da Fit CRP SDK

on:
  push:
    paths:
      - '.github/workflows/re-dafit-crp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch public Da Fit CRP AAR
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          mkdir -p /tmp/crp && cd /tmp/crp && unzip -q /tmp/crp.aar
      - name: Inspect classes and native libraries
        run: |
          set -euxo pipefail
          OUT='re/dafit_crp'
          mkdir -p "$OUT"
          (cd /tmp/crp && find . -maxdepth 4 -type f | sort) > "$OUT/aar-files.txt"
          jar tf /tmp/crp/classes.jar > "$OUT/classes.txt"
          grep -Ei 'jieli|jieli|ota|dfu|firmware|watchface|jl_' "$OUT/classes.txt" > "$OUT/interesting-classes.txt" || true
          strings -a /tmp/crp/classes.jar | grep -Ei 'jieli|jieli|ota|dfu|JLQFN|MOY-|190e|ae00|gr-A|gr-B' > "$OUT/jar-strings.txt" || true
          find /tmp/crp -type f \( -name '*.so' -o -name '*.jar' \) -print > "$OUT/binaries.txt"
          while IFS= read -r f; do
            echo "===== $f ====="
            strings -a "$f" | grep -Ei 'jieli|jieli|rcsp|ota|dfu|ae00|ae01|ae02|190e|JLQFN|MOY-' || true
          done < "$OUT/binaries.txt" > "$OUT/native-interesting.txt"
          : > "$OUT/javap-interesting.txt"
          while IFS= read -r cls; do
            cls="${cls%.class}"; cls="${cls//\//.}"
            echo "===== $cls =====" >> "$OUT/javap-interesting.txt"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$cls" >> "$OUT/javap-interesting.txt" 2>&1 || true
          done < <(grep -Ei 'jieli|jieli|ota|dfu|firmware' "$OUT/classes.txt" | grep '\.class$' | head -n 250)
      - name: Commit analysis
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp
          git commit -m 'Add Da Fit CRP SDK analysis' || exit 0
          git push
