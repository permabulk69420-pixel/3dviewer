name: Reverse engineer Da Fit CRP SDK

on:
  push:
    paths:
      - '.github/workflows/re-dafit-crp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch CRP AAR
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          mkdir -p /tmp/crp && cd /tmp/crp && unzip -q /tmp/crp.aar
      - name: Dump exact JieLi DFU path
        run: |
          set -euxo pipefail
          OUT='re/dafit_crp/javap-dfu-core.txt'
          : > "$OUT"
          for cls in \
            com.crrepa.ble.ota.jieli.JieliDfuController \
            com.crrepa.i0.b \
            com.crrepa.c0.c \
            com.crrepa.c0.d \
            com.crrepa.f.u1 \
            com.crrepa.p0.d \
            com.crrepa.x.a \
            com.crrepa.m.f; do
            echo "===== $cls =====" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$cls" >> "$OUT" 2>&1 || true
          done
      - name: Commit analysis
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/javap-dfu-core.txt
          git commit -m 'Add exact CRP JieLi DFU packet analysis' || exit 0
          git push
