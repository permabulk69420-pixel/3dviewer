name: Extract CRP fingerprint semantics

on:
  push:
    paths:
      - '.github/workflows/re-crp-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Decompile fingerprint-related CRP classes
        run: |
          set -euxo pipefail
          URL='https://raw.githubusercontent.com/momochan32/dafit_moyoung_ble_plugin-1.2.22/a6c97885098696ccc94d75cc2587e794052f6367/android/libs/crpblelib-1.8.3-0321.aar'
          curl -fL "$URL" -o /tmp/crp.aar
          rm -rf /tmp/crp /tmp/classes
          mkdir -p /tmp/crp /tmp/classes "$GITHUB_WORKSPACE/re/dafit_crp"
          cd /tmp/crp && unzip -q /tmp/crp.aar
          cd /tmp/classes && jar xf /tmp/crp/classes.jar

          OUT="$GITHUB_WORKSPACE/re/dafit_crp/fingerprint-semantics.txt"
          : > "$OUT"

          echo '===== RELEVANT CLASS NAMES =====' >> "$OUT"
          find /tmp/classes/com/crrepa -type f -name '*.class' | grep -Ei 'dfu|ota|jieli|storage|version|watchface' | sed 's#^/tmp/classes/##' | sort >> "$OUT" || true

          echo >> "$OUT"
          echo '===== DIRECT CORE CLASSES =====' >> "$OUT"
          for c in \
            com.crrepa.h.a \
            com.crrepa.f.w \
            com.crrepa.f.a2 \
            com.crrepa.e.c \
            com.crrepa.m.a \
            com.crrepa.q.b \
            com.crrepa.ble.conn.type.CRPDeviceVersionType \
            com.crrepa.ble.conn.type.CRPFirmwareUpgradeType \
            com.crrepa.ble.conn.bean.CRPJieliWatchFaceInfo \
            com.crrepa.ble.conn.bean.CRPJieliSupportWatchFaceInfo \
            com.crrepa.ble.conn.bean.CRPFirmwareVersionInfo; do
            echo >> "$OUT"
            echo "===== $c =====" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" >> "$OUT" 2>&1 || true
          done

          echo >> "$OUT"
          echo '===== DFU / OTA TYPE CLASSES =====' >> "$OUT"
          while read -r f; do
            c="${f#/tmp/classes/}"; c="${c%.class}"; c="${c//\//.}"
            echo >> "$OUT"
            echo "===== $c =====" >> "$OUT"
            javap -classpath /tmp/crp/classes.jar -c -p -constants "$c" >> "$OUT" 2>&1 || true
          done < <(find /tmp/classes/com/crrepa/ble/conn -type f -name '*.class' | grep -Ei 'Dfu|Ota|Firmware|Jieli|AvailableStorage' | sort || true)

          wc -l "$OUT"
      - name: Commit result
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add re/dafit_crp/fingerprint-semantics.txt
          git commit -m 'Expand CRP fingerprint semantics' || exit 0
          git push
