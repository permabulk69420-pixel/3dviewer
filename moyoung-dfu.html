<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anko Update Target Query</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;background:#0b0d10;color:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:760px;margin-inline:auto}.card{background:#151922;border:1px solid #283040;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#4e7cff;color:white;margin:4px}button:disabled{opacity:.45}.ok{color:#78e7a2}.warn{color:#ffd37a}.bad{color:#ff8c8c}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:12px;padding:12px;min-height:220px;max-height:520px;overflow:auto}
</style></head>
<body>
<h1>Anko MoYoung update-target query</h1>
<p class="warn">Read/query diagnostic only. This sends command 0x63 with payload 0x00. It does not send the 0x01 update-mode request, upload firmware, erase flash, or reboot the watch.</p>
<div class="card">
<button id="connect">Connect watch</button>
<button id="query" disabled>Query update target</button>
<button id="copy" disabled>Copy report</button>
<div id="status">Not connected</div>
</div>
<div class="card"><pre id="log"></pre></div>
<script>
(()=>{'use strict';
const SERVICE=0xFEEA,SEND=0xFEE2,NOTIFY=0xFEE3;
let device=null,server=null,send=null,notify=null,lines=[];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(s){lines.push(s);$('log').textContent=lines.join('\n');$('log').scrollTop=$('log').scrollHeight}
function hex(a){return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ')}
function packet(cmd,payload=[]){const p=Uint8Array.from(payload),n=5+p.length,o=new Uint8Array(n);o[0]=0xFE;o[1]=0xEA;o[2]=(0x20+(n>>8))&255;o[3]=n&255;o[4]=cmd;o.set(p,5);return o}
function onNotify(ev){const v=ev.target.value;const d=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);log('RX: '+hex(d));if(d.length>=5&&d[0]===0xFE&&d[1]===0xEA&&d[4]===0x63){const p=d.slice(5);log('UPDATE-TARGET REPLY payload: '+hex(p));$('status').textContent='Got update-target reply';$('status').className='ok';$('copy').disabled=false}}
async function connect(){try{device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SERVICE]});server=await device.gatt.connect();const s=await server.getPrimaryService(SERVICE);send=await s.getCharacteristic(SEND);notify=await s.getCharacteristic(NOTIFY);await notify.startNotifications();notify.addEventListener('characteristicvaluechanged',onNotify);$('query').disabled=false;$('status').textContent='Connected: '+(device.name||'watch');$('status').className='ok';log('Connected to FEEA / FEE2 / FEE3.')}catch(e){$('status').textContent='Connect error: '+e.message;$('status').className='bad';log('ERROR: '+e.message)}}
async function query(){try{$('query').disabled=true;$('status').textContent='Querying…';const q=packet(0x63,[0x00]);log('TX query: '+hex(q));await send.writeValueWithoutResponse(q);await sleep(1800);if(!$('status').classList.contains('ok')||!lines.some(x=>x.startsWith('UPDATE-TARGET REPLY'))){$('status').textContent='No 0x63 reply yet';$('status').className='warn';log('No 0x63 reply received in the first 1.8 seconds.');$('copy').disabled=false}}catch(e){$('status').textContent='Query error: '+e.message;$('status').className='bad';log('ERROR: '+e.message);$('copy').disabled=false}finally{$('query').disabled=false}}
$('connect').onclick=connect;$('query').onclick=query;$('copy').onclick=async()=>{await navigator.clipboard.writeText(lines.join('\n'));$('status').textContent='Report copied';};
log('Ready.');
})();
</script>
</body></html>
