<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anko DFU target probe</title>
<style>:root{font-family:system-ui;color-scheme:dark;background:#0b0d10;color:#f4f7fb}body{margin:0;padding:18px;max-width:760px;margin:auto}.card{background:#151922;border:1px solid #283040;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#4e7cff;color:white;margin:4px}button:disabled{opacity:.45}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:12px;padding:12px;min-height:240px;max-height:520px;overflow:auto}.ok{color:#78e7a2}.warn{color:#ffd37a}.bad{color:#ff8c8c}</style></head><body>
<h1>Anko MoYoung DFU target probe</h1>
<p class="warn">v1 — sends only MoYoung command 0x63 with payload 0x00, which queries the HS/DFU target address. It does NOT send 0x63/0x01, does not enter DFU mode, reboot, erase or write firmware.</p>
<div class="card"><button id="connect">Connect watch</button><button id="probe" disabled>Query DFU target</button><button id="copy" disabled>Copy report</button><div id="status">Not connected</div></div>
<div class="card"><pre id="log"></pre></div>
<script>
(()=>{'use strict';
const SVC=0xFEEA,TX=0xFEE2,RX=0xFEE3;let dev,server,tx,rx,lines=[];const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(s){lines.push(s);$('log').textContent=lines.join('\n');$('log').scrollTop=$('log').scrollHeight}
function hex(a){return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ')}
function packet(cmd,payload=[]){const p=Uint8Array.from(payload),n=5+p.length,o=new Uint8Array(n);o[0]=0xFE;o[1]=0xEA;o[2]=(0x20+(n>>8))&255;o[3]=n&255;o[4]=cmd;o.set(p,5);return o}
function onNotify(ev){const v=ev.target.value,d=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);log('RX: '+hex(d));if(d.length>=5&&d[0]===0xFE&&d[1]===0xEA&&d[4]===0x63){const p=d.slice(5);log('DFU QUERY REPLY payload: '+hex(p));if(p.length===6)log('Looks like a 6-byte Bluetooth address: '+Array.from(p).map(x=>x.toString(16).padStart(2,'0')).join(':'));$('status').textContent='Got DFU query reply';$('status').className='ok';$('copy').disabled=false;}}
async function connect(){try{dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC]});server=await dev.gatt.connect();const s=await server.getPrimaryService(SVC);tx=await s.getCharacteristic(TX);rx=await s.getCharacteristic(RX);await rx.startNotifications();rx.addEventListener('characteristicvaluechanged',onNotify);$('probe').disabled=false;$('status').textContent='Connected: '+(dev.name||'watch');$('status').className='ok';log('Connected to FEEA / FEE2 / FEE3.');}catch(e){$('status').textContent='Connect error: '+e.message;$('status').className='bad';log('ERROR: '+e.message)}}
$('connect').onclick=connect;
$('probe').onclick=async()=>{try{$('probe').disabled=true;const q=packet(0x63,[0x00]);log('TX DFU target query: '+hex(q));await tx.writeValueWithoutResponse(q);await sleep(2500);$('copy').disabled=false;if(!$('status').textContent.startsWith('Got')){$('status').textContent='Query sent; no 0x63 reply yet';$('status').className='warn';log('No 0x63 reply seen in 2.5 s.');}}catch(e){$('status').textContent='Probe error: '+e.message;$('status').className='bad';log('ERROR: '+e.message)}finally{$('probe').disabled=false}};
$('copy').onclick=async()=>{await navigator.clipboard.writeText(lines.join('\n'));$('status').textContent='Report copied';};
log('Page JavaScript started successfully.');
})();
</script></body></html>
