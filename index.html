<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Anko JieLi discovery v6</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;background:#0b0d10;color:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:760px;margin:auto}h1{font-size:1.45rem}.sub{color:#aeb7c4}.card{background:#151922;border:1px solid #283040;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#4e7cff;color:white;margin:4px}button.secondary{background:#283246}button:disabled{opacity:.45}.ok{color:#78e7a2}.warn{color:#ffd37a}.bad{color:#ff8c8c}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:12px;padding:12px;min-height:320px;max-height:600px;overflow:auto;font-size:.78rem}</style></head><body>
<h1>Anko JieLi discovery</h1><div class="sub">v6 — exact JieLi GET_TARGET_FEATURE packet from the firmware source. No auth guessing, no OTA mode, no writes to flash.</div>
<div class="card"><button id="connect">1. Connect watch</button><button id="probe" disabled>2. Query target</button><button id="copy" class="secondary" disabled>Copy report</button><div id="status" class="warn" style="margin-top:12px">Not connected</div></div>
<div class="card"><strong>Discovery log</strong><pre id="log"></pre></div>
<script>
(()=>{'use strict';
const SVC=0xAE00,TX=0xAE01,RX=0xAE02;
let dev,server,tx,rx,lines=[],rxCount=0,connecting=false;
const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(s){const line=`[${new Date().toLocaleTimeString()}] ${s}`;lines.push(line);$('log').textContent=lines.join('\n');$('log').scrollTop=$('log').scrollHeight}
function hex(a){return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ')}
function rcsp(opcode,payload){const p=Uint8Array.from(payload),o=new Uint8Array(8+p.length);o.set([0xfe,0xdc,0xba,0xc0,opcode,(p.length>>8)&255,p.length&255]);o.set(p,7);o[o.length-1]=0xef;return o}
async function writeData(a,label){log(label+': '+hex(a));await tx.writeValueWithoutResponse(a);log('  ATT write-without-response accepted')}
function ascii(a){return Array.from(a,b=>b>=32&&b<127?String.fromCharCode(b):'.').join('')}
function parseAttrs(a){const names={0:'protocol_version',1:'sys_info',2:'edr_addr',3:'platform',4:'function_info',5:'firmware_info',6:'sdk_type',7:'uboot_version',8:'double_partition',9:'update_status',10:'vid_pid',11:'authkey',12:'project_code',13:'protocol_mtu',14:'ble_addr',19:'dev_support_func'};let i=0;while(i+2<=a.length){const n=a[i],type=a[i+1];if(n<1||i+1+n>a.length){log('ATTR parse stopped at: '+hex(a.slice(i)));return}const d=a.slice(i+2,i+1+n);log(`ATTR ${type} ${names[type]||'unknown'}: ${hex(d)}${(type===5||type===11||type===12)?' |'+ascii(d)+'|':''}`);if(type===6&&d.length)log(`  SDK type = 0x${d[0].toString(16).padStart(2,'0')}${d[0]===9?' (AC701N watch family)':''}`);if(type===8&&d.length>=2)log(`  double-bank=${!!d[0]}, loader-download=${!!d[1]}`);if(type===13&&d.length>=4)log(`  TX MTU=${(d[0]<<8)|d[1]}, RX MTU=${(d[2]<<8)|d[3]}`);i+=1+n}}
function onNotify(ev){const v=ev.target.value,d=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);rxCount++;log('RX: '+hex(d));if(d.length>=8&&d[0]===0xfe&&d[1]===0xdc&&d[2]===0xba&&d[d.length-1]===0xef){const n=(d[5]<<8)|d[6],body=d.slice(7,Math.min(7+n,d.length-1));log(`RCSP header word=0x${((d[3]<<8)|d[4]).toString(16).padStart(4,'0')} payloadLen=${n}`);log('RCSP payload: '+hex(body));for(let skip=0;skip<=2&&skip<body.length;skip++){const first=body[skip];if(first>0&&skip+first<body.length+1){log(`Trying attribute parse at payload+${skip}`);parseAttrs(body.slice(skip));break}}}}
async function connect(){if(connecting||dev?.gatt?.connected)return;connecting=true;$('connect').disabled=true;try{log('Opening Bluetooth chooser…');dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC]});server=await dev.gatt.connect();const s=await server.getPrimaryService(SVC);tx=await s.getCharacteristic(TX);rx=await s.getCharacteristic(RX);log(`AE01 write=${!!tx.properties.write}, writeWithoutResponse=${!!tx.properties.writeWithoutResponse}`);log(`AE02 notify=${!!rx.properties.notify}, indicate=${!!rx.properties.indicate}`);await rx.startNotifications();rx.addEventListener('characteristicvaluechanged',onNotify);$('probe').disabled=false;$('status').textContent='Connected: '+(dev.name||'watch');$('status').className='ok';log('AE02 notifications enabled.')}catch(e){$('connect').disabled=false;$('status').textContent='Connect failed';$('status').className='bad';log('CONNECT ERROR: '+(e.message||e))}finally{connecting=false}}
async function probe(){try{$('probe').disabled=true;$('copy').disabled=true;$('status').textContent='Querying exact JieLi command…';$('status').className='warn';log('=== v6 EXACT TARGET QUERY ===');let before=rxCount;const android=rcsp(0x03,[0xff,0xff,0xff,0xff,0x00]);await writeData(android,'TX GET_TARGET_FEATURE all attrs / Android');await sleep(2200);if(rxCount===before){log('No RX for Android platform. Trying identical request with iOS platform byte.');const ios=rcsp(0x03,[0xff,0xff,0xff,0xff,0x01]);await writeData(ios,'TX GET_TARGET_FEATURE all attrs / iOS');await sleep(2200)}if(rxCount>before){$('status').textContent='Watch replied — copy report';$('status').className='ok';log('RESULT: AE02 produced a response to the exact target-feature command.')}else{$('status').textContent='No RX — copy report';$('status').className='bad';log('RESULT: exact official GET_TARGET_FEATURE produced no AE02 notification.')}log('=== END v6 QUERY ===')}catch(e){$('status').textContent='Stopped — copy report';$('status').className='bad';log('RESULT ERROR: '+(e.message||e))}finally{$('probe').disabled=false;$('copy').disabled=false}}
$('connect').onclick=connect;$('probe').onclick=probe;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));$('status').textContent='Report copied'}catch{log('Clipboard failed; long-press log to copy')}};log('Ready — v6 exact RCSP target query.');
})();
</script></body></html>
