<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Anko JieLi discovery v5</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;background:#0b0d10;color:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:760px;margin:auto}h1{font-size:1.45rem}.sub{color:#aeb7c4}.card{background:#151922;border:1px solid #283040;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#4e7cff;color:white;margin:4px}button.secondary{background:#283246}button:disabled{opacity:.45}.ok{color:#78e7a2}.warn{color:#ffd37a}.bad{color:#ff8c8c}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:12px;padding:12px;min-height:320px;max-height:600px;overflow:auto;font-size:.78rem}</style></head><body>
<h1>Anko JieLi discovery</h1><div class="sub">v5 — raw-first official HashPair auth, automatic reset fallbacks, then read-only target metadata.</div>
<div class="card"><button id="connect">1. Connect watch</button><button id="probe" disabled>2. Run discovery</button><button id="copy" class="secondary" disabled>Copy report</button><div id="status" class="warn" style="margin-top:12px">Not connected</div></div>
<div class="card"><strong>Discovery log</strong><pre id="log"></pre></div>
<script>
(()=>{'use strict';
const SVC=0xAE00,TX=0xAE01,RX=0xAE02;
const RESET_FF=Uint8Array.from([0xfe,0xdc,0xba,0xc0,0x06,0x00,0x02,0xff,0x01,0xef]);
const RESET_00=Uint8Array.from([0xfe,0xdc,0xba,0xc0,0x06,0x00,0x02,0x00,0x01,0xef]);
const PASS=Uint8Array.from([0x02,0x70,0x61,0x73,0x73]);
let dev,server,tx,rx,authApi,state='idle',resolveAuth,rejectAuth,lines=[],targetSeen=false,rxCount=0,connecting=false;
const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(s){const line=`[${new Date().toLocaleTimeString()}] ${s}`;lines.push(line);$('log').textContent=lines.join('\n');$('log').scrollTop=$('log').scrollHeight}
function hex(a){return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ')}
function frame(flag,cmd,body=[]){const b=Uint8Array.from(body),o=new Uint8Array(8+b.length);o.set([0xfe,0xdc,0xba,flag,cmd,(b.length>>8)&255,b.length&255]);o.set(b,7);o[o.length-1]=0xef;return o}
async function writeData(a,label){log(label+': '+hex(a));if(tx.properties.write){try{await tx.writeValueWithResponse(a);log('  ATT write-with-response accepted');return}catch(e){log('  write-with-response failed: '+e.message)}}if(tx.properties.writeWithoutResponse){await tx.writeValueWithoutResponse(a);log('  ATT write-without-response accepted');return}throw Error('AE01 is not writable')}
async function loadAuth(){if(authApi)return authApi;log('Loading JieLi auth implementation…');const u='https://cdn.jsdelivr.net/gh/hybridherbst/web-bluetooth-e87@9e8ba39f48ffb7ef447847b5bf35afc4fe522ed3/web/src/jl-auth.ts';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('auth module HTTP '+r.status);let s=await r.text();s=s.replace(/\bexport\s+/g,'').replace(/:\s*Record<number,\s*number>/g,'').replace(/:\s*number\[\]/g,'').replace(/:\s*Uint8Array/g,'').replace(/:\s*number/g,'').replace(/new Array<number>/g,'new Array');authApi=(new Function(s+'\nreturn {getRandomAuthData,getEncryptedAuthData};'))();log('JieLi auth implementation loaded.');return authApi}
function parseAttrs(a){const names={0:'protocol_version',1:'sys_info',2:'edr_addr',3:'platform',4:'function_info',5:'firmware_info',6:'sdk_type',7:'uboot_version',8:'double_partition',9:'update_status',10:'vid_pid',11:'authkey',12:'project_code',13:'protocol_mtu',19:'dev_support_func'};let i=0;while(i+2<=a.length){const n=a[i];if(n<1||i+1+n>a.length){log('ATTR parse stopped; remaining: '+hex(a.slice(i)));break}const type=a[i+1],data=a.slice(i+2,i+1+n);log(`ATTR ${type} ${names[type]||'unknown'}: ${hex(data)}`);if(type===5)log('  firmware ASCII: '+Array.from(data,b=>b>=32&&b<127?String.fromCharCode(b):'.').join(''));if(type===6&&data.length)log('  SDK type = 0x'+data[0].toString(16).padStart(2,'0'));if(type===8&&data.length>=3)log(`  OTA double-bank=${!!data[0]}, loader-download=${!!data[1]}, channel=${data[2]}`);if(type===10&&data.length>=4)log('  VID=0x'+((data[0]<<8)|data[1]).toString(16).padStart(4,'0')+' PID=0x'+((data[2]<<8)|data[3]).toString(16).padStart(4,'0'));if(type===12)log('  project ASCII: '+Array.from(data,b=>b>=32&&b<127?String.fromCharCode(b):'.').join(''));if(type===13&&data.length>=2)log('  RCSP MTU = '+((data[0]<<8)|data[1]));i+=1+n}}
function parseRcsp(d){if(d.length<8||d[0]!==0xfe||d[1]!==0xdc||d[2]!==0xba||d[d.length-1]!==0xef)return null;const n=(d[5]<<8)|d[6];if(d.length!==8+n)return null;return{flag:d[3],cmd:d[4],body:d.slice(7,7+n)}}
function onNotify(ev){const v=ev.target.value,d=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);rxCount++;log('RX: '+hex(d));const f=parseRcsp(d);if(f){log(`RCSP cmd=0x${f.cmd.toString(16).padStart(2,'0')} flag=0x${f.flag.toString(16).padStart(2,'0')} body=${hex(f.body)}`);if(f.cmd===0x03&&f.body.length>=2){targetSeen=true;log(`GET_TARGET_INFO status=${f.body[0]} seq=${f.body[1]}`);parseAttrs(f.body.slice(2))}return}if(state==='waitAccept'&&d.length===17&&d[0]===1){state='waitChallenge';log('Device returned code 01 response; sending PASS.');writeData(PASS,'TX PASS').catch(e=>rejectAuth&&rejectAuth(e));return}if(state==='waitChallenge'&&d.length===17&&d[0]===0){try{state='waitPass';log('Device sent its code 00 challenge.');writeData(authApi.getEncryptedAuthData(d),'TX code 01 encrypted response').catch(e=>rejectAuth&&rejectAuth(e))}catch(e){rejectAuth&&rejectAuth(e)}return}if(state==='waitPass'&&d.length>=5&&d[0]===2&&d[1]===0x70&&d[2]===0x61&&d[3]===0x73&&d[4]===0x73){state='done';log('AUTH SUCCESS');resolveAuth&&resolveAuth()}}
async function connect(){if(connecting||dev?.gatt?.connected)return;connecting=true;$('connect').disabled=true;try{if(!('bluetooth'in navigator))throw Error('Web Bluetooth unavailable');log('Opening Bluetooth chooser…');dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC]});server=await dev.gatt.connect();const s=await server.getPrimaryService(SVC);tx=await s.getCharacteristic(TX);rx=await s.getCharacteristic(RX);log(`AE01 props: write=${!!tx.properties.write}, writeWithoutResponse=${!!tx.properties.writeWithoutResponse}`);log(`AE02 props: notify=${!!rx.properties.notify}, indicate=${!!rx.properties.indicate}`);await rx.startNotifications();rx.addEventListener('characteristicvaluechanged',onNotify);$('probe').disabled=false;$('status').textContent='Connected: '+(dev.name||'watch');$('status').className='ok';log('Connected once; AE02 notifications enabled.')}catch(e){$('status').textContent='Connect failed';$('status').className='bad';$('connect').disabled=false;log('CONNECT ERROR: '+(e.message||e))}finally{connecting=false}}
async function authAttempt(name,reset){log(`--- AUTH ATTEMPT: ${name} ---`);state='idle';if(reset){const before=rxCount;await writeData(reset,'TX reset');await sleep(700);log(rxCount>before?'Reset produced RX.':'Reset produced no RX.')}state='waitAccept';let settled=false;const p=new Promise((res,rej)=>{resolveAuth=()=>{settled=true;res()};rejectAuth=e=>{settled=true;rej(e)};setTimeout(()=>{if(!settled&&state!=='done'){settled=true;rej(Error('no auth response; last state='+state))}},3000)});await writeData(authApi.getRandomAuthData(),'TX code 00 random challenge');try{await p;return true}catch(e){log('Attempt failed: '+e.message);state='idle';return false}}
async function queryTarget(label=''){targetSeen=false;log('--- TARGET INFO '+label+' ---');await writeData(frame(0xc0,0x03,[0x42,0xff,0xff,0xff,0xff,0x00]),'TX GET_TARGET_INFO platform=0');await sleep(1600);if(!targetSeen){await writeData(frame(0xc0,0x03,[0x43,0xff,0xff,0xff,0xff,0x01]),'TX GET_TARGET_INFO platform=1');await sleep(1800)}return targetSeen}
async function probe(){try{$('probe').disabled=true;$('copy').disabled=true;$('status').textContent='Running automatic discovery…';$('status').className='warn';await loadAuth();log('=== v5 JIELI DISCOVERY START ===');let ok=await authAttempt('raw first / no reset',null);if(!ok)ok=await authAttempt('official iOS JL_HashPair reset FF 01',RESET_FF);if(!ok)ok=await authAttempt('Android RcspAuth reset 00 01',RESET_00);if(ok){$('status').textContent='Authenticated; querying target…';if(await queryTarget('(authenticated)')){$('status').textContent='Discovery complete — copy report';$('status').className='ok';log('=== DISCOVERY COMPLETE ===');return}log('Authenticated but target query gave no reply.')}else{log('All auth variants failed. Trying read-only target query without auth.');if(await queryTarget('(unauthenticated fallback)')){$('status').textContent='Target info received without auth — copy report';$('status').className='ok';return}}$('status').textContent='No target info — copy report';$('status').className='bad';log('RESULT: no usable target response after all safe variants.')}catch(e){$('status').textContent='Stopped — copy report';$('status').className='bad';log('RESULT: '+(e.message||e))}finally{$('probe').disabled=false;$('copy').disabled=false}}
$('connect').onclick=connect;$('probe').onclick=probe;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));$('status').textContent='Report copied'}catch{log('Clipboard failed; long-press log to copy')}};log('Ready — v5 JieLi discovery.');
})();
</script></body></html>
