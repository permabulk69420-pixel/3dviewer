<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Anko updater enumerator</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;background:#0b0d10;color:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:820px;margin:auto}h1{font-size:1.45rem}.sub{color:#aeb7c4}.card{background:#151922;border:1px solid #283040;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#4e7cff;color:white;margin:4px}button.secondary{background:#283246}button:disabled{opacity:.45}.ok{color:#78e7a2}.warn{color:#ffd37a}.bad{color:#ff8c8c}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:12px;padding:12px;min-height:320px;max-height:620px;overflow:auto;font-size:.78rem}</style></head>
<body><h1>Anko updater / bootloader enumerator</h1>
<div class="sub">v12 — enters the already-confirmed CRP/JieLi updater state, sends zero firmware data, disconnects when the watch requests offset 0, then enumerates the updater BLE interface after you reconnect. No FEE5 payloads and no file-check/finalize packet.</div>
<div class="card"><button id="enter">1. Enter updater (no data)</button><button id="scan" disabled>2. Reconnect + enumerate updater</button><button id="copy" class="secondary" disabled>Copy report</button><div id="status" class="warn" style="margin-top:12px">Ready</div></div>
<div class="card"><strong>Log</strong><pre id="log"></pre></div>
<script>(()=>{'use strict';
const FEEA=0xFEEA;let dev=null,server=null,fee2=null,lines=[],stage='idle',disconnectTimer=null;
const $=id=>document.getElementById(id);const hex=a=>Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ');const short=u=>{const m=u.toLowerCase().match(/^0000([0-9a-f]{4})-/);return m?m[1]:u};const txt=a=>{try{return new TextDecoder().decode(a).replace(/\0+$/g,'')}catch{return ''}};
function log(s){const line=`[${new Date().toLocaleTimeString()}] ${s}`;lines.push(line);$('log').textContent=lines.join('\n');$('log').scrollTop=$('log').scrollHeight;}
async function disconnectSoon(){if(disconnectTimer)return;disconnectTimer=setTimeout(()=>{try{if(dev?.gatt?.connected)dev.gatt.disconnect();log('Disconnected deliberately. Zero firmware chunks were sent.');$('scan').disabled=false;$('status').textContent='Updater requested offset 0 — now tap step 2';$('status').className='ok';}catch(e){log('Disconnect error: '+e.message)}},250);}
function notify(ev){const ch=ev.target,v=ch.value,d=new Uint8Array(v.buffer,v.byteOffset,v.byteLength),id=short(ch.uuid).toUpperCase();log(`RX ${id}: ${hex(d)}`);if(d.length>=5&&d[0]===0xfe&&d[1]===0xea){const cmd=d[4],p=d.slice(5);log(`  CRP cmd=0x${cmd.toString(16).padStart(2,'0')} payload=${hex(p)}`);if(stage==='enter'&&cmd===0x63&&p.length>=2&&p[0]===0&&p[1]===0){log('Updater accepted DFU start and requested transfer offset/index 0.');disconnectSoon();}}}
async function enumerate(server,label){let services=[];try{services=await server.getPrimaryServices();}catch(e){log(`${label}: getPrimaryServices failed: ${e.message}`);return;}log(`${label}: ${services.length} primary service(s)`);for(const svc of services){const sid=short(svc.uuid).toUpperCase();log(`SERVICE ${sid}`);let chars=[];try{chars=await svc.getCharacteristics();}catch(e){log(`  enumerate failed: ${e.message}`);continue;}for(const ch of chars){const cid=short(ch.uuid).toUpperCase(),p=ch.properties;log(`  ${cid} read=${!!p.read} write=${!!p.write} writeNR=${!!p.writeWithoutResponse} notify=${!!p.notify} indicate=${!!p.indicate}`);if(p.read){try{const v=await ch.readValue(),d=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);log(`    READ ${d.length} B: ${hex(d)}${d.length&&txt(d).trim()?` | ${JSON.stringify(txt(d))}`:''}`);}catch(e){log(`    READ failed: ${e.message}`);}}}}}
async function connectNormal(){dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[FEEA,0xAE00,0x180A,0x180F]});server=await dev.gatt.connect();log(`Connected normal firmware: ${dev.name||'watch'}`);const svc=await server.getPrimaryService(FEEA);const chars=await svc.getCharacteristics();for(const ch of chars){const id=short(ch.uuid).toLowerCase();if(id==='fee2')fee2=ch;if(ch.properties.notify||ch.properties.indicate){try{await ch.startNotifications();ch.addEventListener('characteristicvaluechanged',notify);}catch{}}}if(!fee2)throw Error('FEE2 missing');}
$('enter').onclick=async()=>{if(stage==='enter')return;stage='enter';$('enter').disabled=true;$('copy').disabled=false;$('status').textContent='Connecting…';$('status').className='warn';try{await connectNormal();const packet=Uint8Array.from([0xfe,0xea,0x20,0x09,0x63,0x00,0x10,0x00,0x00]);log('TX FEE2 DFU START only: '+hex(packet));if(fee2.properties.writeWithoutResponse)await fee2.writeValueWithoutResponse(packet);else await fee2.writeValueWithResponse(packet);log('ATT write accepted. Waiting only for offset-0 request; no firmware data will be sent.');$('status').textContent='Waiting for updater offset request…';setTimeout(()=>{if(stage==='enter'&&dev?.gatt?.connected&&!disconnectTimer){log('No offset-0 request within 4s; disconnecting without sending data.');try{dev.gatt.disconnect()}catch{}$('scan').disabled=false;$('status').textContent='Disconnected — tap step 2';}},4000);}catch(e){log('ENTER ERROR: '+(e.message||e));$('status').textContent='Enter-updater error — copy report';$('status').className='bad';$('enter').disabled=false;}};
$('scan').onclick=async()=>{stage='scan';$('scan').disabled=true;$('status').textContent='Open Bluetooth chooser and select the watch/updater';$('status').className='warn';try{const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[FEEA,0xAE00,0x180A,0x180F]});const s=await d.gatt.connect();log(`Connected after updater entry: ${d.name||'(unnamed)'}`);await enumerate(s,'UPDATER ENUMERATION');$('status').textContent='Updater enumeration complete — copy report';$('status').className='ok';$('copy').disabled=false;}catch(e){log('SCAN ERROR: '+(e.message||e));$('status').textContent='Updater scan error — copy report';$('status').className='bad';$('scan').disabled=false;}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));$('status').textContent='Report copied';}catch(e){log('Clipboard failed: '+e.message)}};log('Ready — v12 updater/bootloader enumerator.');})();</script></body></html>
