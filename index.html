<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Anko CRP transport probe v7</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;background:#0b0d10;color:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:760px;margin:auto}h1{font-size:1.45rem}.sub{color:#aeb7c4}.card{background:#151922;border:1px solid #283040;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:#4e7cff;color:white;margin:4px}button.secondary{background:#283246}button:disabled{opacity:.45}.ok{color:#78e7a2}.warn{color:#ffd37a}.bad{color:#ff8c8c}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border-radius:12px;padding:12px;min-height:320px;max-height:600px;overflow:auto;font-size:.78rem}</style></head><body>
<h1>Anko CRP/JieLi transport probe</h1>
<div class="sub">v7 — Da Fit CRP routing: normal commands on FEE2, JieLi firmware command 0x63 on FEE5. Listens to every notify-capable FEEA characteristic. Sends no firmware data and does not enter OTA mode.</div>
<div class="card"><button id="connect">1. Connect watch</button><button id="probe" disabled>2. Probe FEE5 transport</button><button id="copy" class="secondary" disabled>Copy report</button><div id="status" class="warn" style="margin-top:12px">Not connected</div></div>
<div class="card"><strong>Probe log</strong><pre id="log"></pre></div>
<script>
(()=>{'use strict';
const SVC=0xFEEA;
let dev,server,svc,chars=new Map(),lines=[],rxCount=0,connecting=false;
const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(s){const line=`[${new Date().toLocaleTimeString()}] ${s}`;lines.push(line);$('log').textContent=lines.join('\n');$('log').scrollTop=$('log').scrollHeight}
function hex(a){return Array.from(a,b=>b.toString(16).padStart(2,'0')).join(' ')}
function shortUuid(u){const m=u.toLowerCase().match(/^0000([0-9a-f]{4})-/);return m?m[1]:u}
function frame(cmd,payload=[]){const p=Uint8Array.from(payload),n=p.length+5,o=new Uint8Array(n);o[0]=0xfe;o[1]=0xea;o[2]=0x20;o[3]=n;o[4]=cmd;o.set(p,5);return o}
function onNotify(ev){const ch=ev.target,v=ch.value,d=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);rxCount++;log(`RX ${shortUuid(ch.uuid).toUpperCase()}: ${hex(d)}`)}
async function writeChar(ch,a,label){if(!ch)throw Error(label+': characteristic missing');log(`${label}: ${hex(a)}`);if(ch.properties.writeWithoutResponse){await ch.writeValueWithoutResponse(a);log('  ATT write-without-response accepted');return}if(ch.properties.write){await ch.writeValueWithResponse(a);log('  ATT write-with-response accepted');return}throw Error(label+': characteristic not writable')}
async function connect(){if(connecting||dev?.gatt?.connected)return;connecting=true;$('connect').disabled=true;try{log('Opening Bluetooth chooser…');dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SVC]});server=await dev.gatt.connect();svc=await server.getPrimaryService(SVC);const all=await svc.getCharacteristics();for(const ch of all){const id=shortUuid(ch.uuid).toLowerCase();chars.set(id,ch);log(`${id.toUpperCase()} props: read=${!!ch.properties.read} write=${!!ch.properties.write} writeNR=${!!ch.properties.writeWithoutResponse} notify=${!!ch.properties.notify} indicate=${!!ch.properties.indicate}`)}for(const [id,ch] of chars){if(ch.properties.notify||ch.properties.indicate){try{await ch.startNotifications();ch.addEventListener('characteristicvaluechanged',onNotify);log(`Notifications enabled on ${id.toUpperCase()}`)}catch(e){log(`Could not enable ${id.toUpperCase()}: ${e.message}`)}}$('probe').disabled=false;$('status').textContent='Connected: '+(dev.name||'watch');$('status').className='ok'}catch(e){$('connect').disabled=false;$('status').textContent='Connect failed';$('status').className='bad';log('CONNECT ERROR: '+(e.message||e))}finally{connecting=false}}
async function probe(){try{$('probe').disabled=true;$('copy').disabled=true;$('status').textContent='Probing CRP transport…';$('status').className='warn';log('=== v7 CRP TRANSPORT PROBE ===');const fee2=chars.get('fee2'),fee5=chars.get('fee5');if(!fee5)throw Error('FEE5 is not exposed by this watch');let before=rxCount;if(fee2){await writeChar(fee2,frame(0x2e),'CONTROL TX FEE2 cmd 0x2E');await sleep(1400);log(`Control response count: ${rxCount-before}`)}else log('FEE2 missing; skipping control query.');before=rxCount;await writeChar(fee5,frame(0x63),'TX FEE5 cmd 0x63 / empty payload');await sleep(1700);if(rxCount===before){log('No RX to empty 0x63; trying the one-byte 00 form used in the earlier probe, now on the CRP-routed FEE5 characteristic.');await writeChar(fee5,frame(0x63,[0x00]),'TX FEE5 cmd 0x63 payload 00');await sleep(2500)}const got=rxCount-before;if(got){$('status').textContent='FEE5 produced a response — copy report';$('status').className='ok';log(`RESULT: ${got} notification(s) after FEE5 0x63 traffic.`)}else{$('status').textContent='No FEE5 response — copy report';$('status').className='bad';log('RESULT: no notification followed either safe FEE5 0x63 form.')}log('=== END v7 PROBE ===')}catch(e){$('status').textContent='Stopped — copy report';$('status').className='bad';log('RESULT ERROR: '+(e.message||e))}finally{$('probe').disabled=false;$('copy').disabled=false}}
$('connect').onclick=connect;$('probe').onclick=probe;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));$('status').textContent='Report copied'}catch{log('Clipboard failed; long-press log to copy')}};log('Ready — v7 CRP/JieLi FEE5 transport probe.');
})();
</script></body></html>
